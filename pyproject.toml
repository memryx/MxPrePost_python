[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memryx-posts"
version = "0.0.1"
description = "Optimized End-to-End AI Tasks for MemryX Accelerators"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MemryX Inc.", email = "developer@memryx.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "opencv-python~=4.11.0",
  "numpy"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<9",
  "pylint>=4.0.0",
  "pydata-sphinx-theme>=0.15,<1",
  "sphinx>=7.0,<8",
  "sphinx_design"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pip]
extra-index-url = ["https://devtest.memryx.com/pip"]

